<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>憋憋杯 BBC - Phigros自制谱面创作赛事</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 动态渐变背景 */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #FFD8A8, #87CEEB);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            z-index: -1;
        }

        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* 容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 头部 */
        header {
            text-align: center;
            padding: 60px 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            margin-bottom: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 3em;
            color: #2c3e50;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            font-size: 1.2em;
            color: #555;
            margin-bottom: 10px;
        }

        /* 赛事信息卡片 */
        .info-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .info-section h2 {
            color: #3498db;
            margin-bottom: 20px;
            font-size: 2em;
            border-left: 5px solid #3498db;
            padding-left: 15px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .info-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            transition: transform 0.3s ease;
        }

        .info-card:hover {
            transform: translateY(-5px);
        }

        .info-card h3 {
            margin-bottom: 10px;
            font-size: 1.3em;
        }

        /* 历届谱面下载区域 */
        .download-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .download-section h2 {
            color: #e74c3c;
            margin-bottom: 30px;
            font-size: 2em;
            border-left: 5px solid #e74c3c;
            padding-left: 15px;
        }

        .edition-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .edition-card {
            background: white;
            border: 2px solid #ddd;
            border-radius: 12px;
            padding: 25px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .edition-card:hover {
            border-color: #3498db;
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.3);
            transform: translateY(-3px);
        }

        .edition-card h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .edition-info {
            color: #666;
            margin-bottom: 15px;
            font-size: 0.9em;
        }

        .download-btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }

        .download-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .download-btn.disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }

        .download-btn.disabled:hover {
            transform: none;
            box-shadow: none;
        }

        /* 页脚 */
        footer {
            text-align: center;
            padding: 30px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            margin-top: 30px;
        }

        footer a {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        footer a:hover {
            color: #2980b9;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .edition-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="animated-bg"></div>

    <div class="container">
        <!-- 头部 -->
        <header>
            <h1>🎵 憋憋杯 BBC 🎵</h1>
            <p class="subtitle">Phigros 自制谱面创作赛事</p>
            <p class="subtitle">主办方：5071</p>
        </header>

        <!-- 6thBBC 赛事信息 -->
        <section class="info-section">
            <h2>📢 第七届憋憋杯 (6thBBC)</h2>
            <div class="info-grid">
                <div class="info-card">
                    <h3>📅 赛事时间</h3>
                    <p>2026.8.24 - 2027.1.27</p>
                    <p style="margin-top: 10px; font-size: 0.9em;">谱面放出：2027.2.8</p>
                </div>
                <div class="info-card">
                    <h3>🎮 赛道设置</h3>
                    <p>常规赛道 / 娱乐赛道</p>
                    <p>单人赛道 / 多人赛道</p>
                </div>
                <div class="info-card">
                    <h3>🏆 奖金设置</h3>
                    <p>🥇 第一名：¥20</p>
                    <p>🥈 第二名：¥15</p>
                    <p>🥉 第三名：¥10</p>
                </div>
                <div class="info-card">
                    <h3>📜 赛事规则</h3>
                    <p>✅ 有名赛</p>
                    <p>❌ 禁止泄露谱面</p>
                    <p>❌ 禁止刷票</p>
                </div>
            </div>
            <div style="margin-top: 30px; text-align: center; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); padding: 20px; border-radius: 10px; color: white;">
                <h3 style="margin-bottom: 10px;">💬 交流群</h3>
                <p style="font-size: 1.5em; font-weight: bold;">335109209</p>
                <p style="margin-top: 10px; font-size: 0.9em;">欢迎萌新和大佬参加！</p>
            </div>
        </section>

        <!-- 历届谱面下载 -->
        <section class="download-section">
            <h2>📥 历届谱面下载</h2>
            <div class="edition-list" id="editionList">
                <!-- 将通过JavaScript动态生成 -->
            </div>
        </section>

        <!-- 页脚 -->
        <footer>
            <p>© 2024-2027 憋憋杯 BBC | 主办方：5071</p>
            <p style="margin-top: 10px;">
                <a href="https://github.com" target="_blank">GitHub</a> | 
                <a href="#" onclick="alert('QQ群：335109209')">联系我们</a>
            </p>
        </footer>
    </div>

    <script>
        // 历届赛事数据
        const editions = [
            {
                name: '第六届憋憋杯',
                code: '5thBBC',
                year: '2025',
                info: '往届精彩谱面作品集',
                downloadLink: '#', // 替换为实际下载链接
                available: false
            },
            {
                name: '第五届憋憋杯',
                code: '4thBBC',
                year: '2024',
                info: '往届精彩谱面作品集',
                downloadLink: '#',
                available: false
            },
            {
                name: '第四届憋憋杯',
                code: '3rdBBC',
                year: '2023',
                info: '往届精彩谱面作品集',
                downloadLink: '#',
                available: false
            },
            {
                name: '第三届憋憋杯',
                code: '2ndBBC',
                year: '2022',
                info: '往届精彩谱面作品集',
                downloadLink: '#',
                available: false
            },
            {
                name: '第二届憋憋杯',
                code: '1stBBC',
                year: '2021',
                info: '往届精彩谱面作品集',
                downloadLink: '#',
                available: false
            },
            {
                name: '第一届憋憋杯',
                code: '0thBBC',
                year: '2020',
                info: '往届精彩谱面作品集',
                downloadLink: '#',
                available: false
            }
        ];

        // 动态生成历届赛事卡片
        function renderEditions() {
            const container = document.getElementById('editionList');
            
            editions.forEach(edition => {
                const card = document.createElement('div');
                card.className = 'edition-card';
                
                card.innerHTML = `
                    <h3>${edition.name}</h3>
                    <p class="edition-info">📅 ${edition.year} | ${edition.code}</p>
                    <p class="edition-info">${edition.info}</p>
                    <a href="${edition.downloadLink}" 
                       class="download-btn ${!edition.available ? 'disabled' : ''}"
                       ${!edition.available ? 'onclick="return false;"' : ''}
                       ${edition.available ? 'download' : ''}>
                        ${edition.available ? '⬇️ 立即下载' : '🔒 整理中'}
                    </a>
                `;
                
                container.appendChild(card);
            });
        }

        // 页面加载时执行
        window.onload = function() {
            renderEditions();
        };

        // 添加平滑滚动效果
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth'
                    });
                }
            });
        });
    </script>
</body>
</html>
